version: '3.8'

services:
  neo4j:
    image: neo4j:5.15
    container_name: neo4j-benchmark
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/benchmark123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build: ./backend
    container_name: mork-neo4j-backend
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=benchmark123
      - MORK_SERVER_URL=http://host.docker.internal:8000
    depends_on:
      - neo4j
    volumes:
      - ./data:/app/data
      - ../target/release:/app/mork_binaries

  frontend:
    build: ./frontend
    container_name: mork-neo4j-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://localhost:8080

volumes:
  neo4j_data:
  neo4j_logs: